<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flying Swords</title>
<style>
  html,body{margin:0;height:100%;background:#05070f;overflow:hidden}
  canvas{display:block}
  #cam{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none}
  #note{position:fixed;left:0;right:0;bottom:24px;text-align:center;color:#fff;opacity:.35;
    font:300 13px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.04em;transition:opacity 1.2s;pointer-events:none}
  #note.off{opacity:0}
  #help{position:fixed;left:28px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:18px;
    font:300 13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;pointer-events:none}
  #help div{opacity:.35;transition:opacity .4s;padding-left:12px;border-left:1px solid rgba(255,255,255,.25)}
  #help div.on{opacity:1;border-left-color:#fff}
  #help b{display:block;font-weight:500;letter-spacing:.03em}
  #help span{opacity:.7}
  @media(max-width:700px){#help{display:none}}
</style>
</head>
<body>
<div id="help">
  <div data-g="open"><b>Open hand</b><span>Sphere · finger spread sets the size</span></div>
  <div data-g="fist"><b>Fist</b><span>Compression · open your hand to explode</span></div>
  <div data-g="point"><b>Index finger only</b><span>Stream of swords along your finger</span></div>
</div>
<div id="note">Show your hand to the camera</div>
<video id="cam" playsinline muted></video>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script>
const N = 10000;
const CAM_Z = 14;

/* ---------- Scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: devicePixelRatio < 2, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070f);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
camera.position.z = CAM_Z;
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
const viewH = 2 * CAM_Z * Math.tan(THREE.MathUtils.degToRad(30)); // visible height at z=0
const viewW = () => viewH * camera.aspect;

/* ---------- Swords (InstancedMesh) ---------- */
const blade = new THREE.ConeGeometry(0.045, 0.75, 4); blade.scale(1, 1, 0.3); blade.translate(0, 0.375, 0);
const guard = new THREE.BoxGeometry(0.2, 0.025, 0.05); guard.translate(0, 0, 0);
const hilt  = new THREE.CylinderGeometry(0.018, 0.018, 0.2, 6); hilt.translate(0, -0.12, 0);
const pommel = new THREE.SphereGeometry(0.03, 6, 6); pommel.translate(0, -0.23, 0);
const geo = THREE.BufferGeometryUtils.mergeBufferGeometries([blade, guard, hilt, pommel]);
geo.translate(0, -0.1, 0);
const mat = new THREE.MeshBasicMaterial();
const mesh = new THREE.InstancedMesh(geo, mat, N);
mesh.frustumCulled = false;
scene.add(mesh);

const pos = new Float32Array(N * 3);
const vel = new Float32Array(N * 3);
const U   = new Float32Array(N * 3);   // fixed unit direction of each sword
const S1  = new Float32Array(N);       // random seeds
const S2  = new Float32Array(N);
const quats = Array.from({ length: N }, () => new THREE.Quaternion());
const col = new THREE.Color();
const BASE = new Float32Array(N * 3);

for (let i = 0; i < N; i++) {
  const z = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, r = Math.sqrt(1 - z * z);
  U[i * 3] = r * Math.cos(a); U[i * 3 + 1] = z; U[i * 3 + 2] = r * Math.sin(a);
  S1[i] = Math.random(); S2[i] = Math.random();
  pos.set([U[i*3] * 5, U[i*3+1] * 5, U[i*3+2] * 5], i * 3);
  col.setHSL(0.10 + 0.27 * S1[i], 1, 0.5);       // gold → emerald green
  BASE.set([col.r, col.g, col.b], i * 3);
  mesh.setColorAt(i, col);
}
mesh.instanceColor.needsUpdate = true;

/* ---------- Hand state ---------- */
let lastR = 0, lx = 0, ly = 0, hvx = 0, hvy = 0;
const hand = { active: false, x: 0, y: 0, size: 4, gesture: 'open', dx: 0, dy: 1, lastSeen: -9 };
const c = { x: 0, y: 0, size: 5, dx: 0, dy: 1 };      // smoothed values
let useMouse = false, prevGesture = 'open', burst = 0, gStable = 0, gCand = 'open', fistT = -9;

const d2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const toWorld = (l) => ({ x: (0.5 - l.x) * viewW(), y: (0.5 - l.y) * viewH });

function setGesture(g) {
  if (g === gCand) gStable++; else { gCand = g; gStable = 0; }
  if (gStable >= 1) {
    if (g !== hand.gesture) {
      const nw = performance.now() / 1000;
      if (hand.gesture === 'fist') fistT = nw;
      if (g === 'open' && nw - fistT < 0.8 && burst === 0) burst = 1;   // explosion (even if the index finger unfolds first)
      hand.gesture = g;
    }
  }
}

function onResults(res) {
  const L = res.multiHandLandmarks || [];
  if (!L.length) { hand.active = false; return; }
  useMouse = false;
  hand.active = true; hand.lastSeen = performance.now() / 1000;

  const a = L[0], palm = d2(a[0], a[9]) || 0.1;
  const ext = (tip, pip) => d2(a[tip], a[0]) > d2(a[pip], a[0]) * 1.1;
  const idx = ext(8, 6), mid = ext(12, 10), ring = ext(16, 14), pky = ext(20, 18);
  const n = idx + mid + ring + pky;

  const w = toWorld(a[9]);
  hand.x = w.x; hand.y = w.y;
  hand.size = 1.2 + clamp(d2(a[4], a[20]) / palm, 0.8, 3.6) * 1.1;

  let g = 'open';
  if (n === 0) g = 'fist';
  else if (idx && n === 1) g = 'point';

  const nowS = performance.now() / 1000;
  // prediction: extend the motion to compensate for camera latency
  const dr = nowS - lastR;
  if (lastR && dr > 0.004 && dr < 0.2) {
    hvx += ((hand.x - lx) / dr - hvx) * 0.5; hvy += ((hand.y - ly) / dr - hvy) * 0.5;
  } else { hvx = 0; hvy = 0; }
  lx = hand.x; ly = hand.y; lastR = nowS;
  hand.x += clamp(hvx * 0.04, -1.5, 1.5); hand.y += clamp(hvy * 0.04, -1.5, 1.5);
  const dx = -(a[8].x - a[5].x), dy = -(a[8].y - a[5].y), m = Math.hypot(dx, dy) || 1;
  hand.dx = dx / m; hand.dy = dy / m;
  setGesture(g);
}

/* ---------- Camera (auto start, mouse fallback) ---------- */
const note = document.getElementById('note');
const helpItems = [...document.querySelectorAll('#help div')];
(async () => {
  try {
    const video = document.getElementById('cam');
    const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}` });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    hands.onResults(onResults);
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 480 }, height: { ideal: 360 }, frameRate: { ideal: 60 }, facingMode: 'user' }
    });
    await video.play();
    let busy = false;
    const pump = async () => {
      if (!busy && video.readyState >= 2) { busy = true; try { await hands.send({ image: video }); } finally { busy = false; } }
      video.requestVideoFrameCallback ? video.requestVideoFrameCallback(pump) : requestAnimationFrame(pump);
    };
    pump();
  } catch (e) {
    console.warn('Webcam unavailable, falling back to mouse mode', e);
    useMouse = true; hand.size = 4; note.textContent = 'Mouse mode: hold click = fist, wheel = size';
  }
})();
addEventListener('keydown', e => { if (e.key === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); });

/* ---------- Mouse fallback ---------- */
let mouseDown = false;
addEventListener('mousemove', e => {
  if (!useMouse) return;
  hand.active = true; hand.lastSeen = performance.now() / 1000;
  hand.x = (e.clientX / innerWidth - 0.5) * viewW();
  hand.y = (0.5 - e.clientY / innerHeight) * viewH;
});
addEventListener('mousedown', e => { if (useMouse && !e.target.closest('button')) { mouseDown = true; hand.gesture = 'fist'; } });
addEventListener('mouseup',   () => { if (useMouse && mouseDown) { mouseDown = false; hand.gesture = 'open'; burst = 1; } });
addEventListener('wheel', e => { if (useMouse) hand.size = clamp(hand.size - e.deltaY * 0.003, 1.5, 9); });

/* ---------- Animation loop ---------- */
const dummy = new THREE.Object3D();
const UP = new THREE.Vector3(0, 1, 0), tmp = new THREE.Vector3();
let last = performance.now() / 1000, t = 0;

function frame() {
  requestAnimationFrame(frame);
  const now = performance.now() / 1000;
  const dt = Math.min(0.033, now - last); last = now; t += dt;

  const live = hand.active && now - hand.lastSeen < 0.4;
  const g = live ? hand.gesture : 'idle';
  if (live) note.classList.add('off');
  const gk = g;
  helpItems.forEach(el => el.classList.toggle('on', el.dataset.g === gk));

  // hand smoothing
  const k = 1 - Math.exp(-dt * 80);
  const tx = live ? hand.x : 0, ty = live ? hand.y : 0;
  c.x += (tx - c.x) * k; c.y += (ty - c.y) * k;
  c.size += ((live ? hand.size : 5) - c.size) * k;
  c.dx += (hand.dx - c.dx) * k; c.dy += (hand.dy - c.dy) * k;
  const dl = Math.hypot(c.dx, c.dy) || 1, pdx = c.dx / dl, pdy = c.dy / dl;

  // explosion: radial impulse
  if (burst === 1) {
    for (let i = 0; i < N; i++) {
      const f = 9 + Math.random() * 13;
      vel[i*3] += U[i*3] * f; vel[i*3+1] += U[i*3+1] * f; vel[i*3+2] += U[i*3+2] * f;
    }
    burst = 0.999;
  }
  const bT = burst > 0 && burst < 1 ? burst : 0;
  if (bT) burst = Math.max(0, burst - dt * 0.22);

  const stiff = 220 * (1 - bT) * (1 - bT);   // almost zero at the start of the explosion, gradually returns
  const damp = Math.exp(-dt * (bT ? 1.4 + 24.6 * (1 - bT) * (1 - bT) : 26));
  const cosT = Math.cos(0.45), sinT = Math.sin(0.45);

  for (let i = 0; i < N; i++) {
    const i3 = i * 3, ux = U[i3], uy = U[i3+1], uz = U[i3+2];
    let tx3, ty3, tz3;

    if (g === 'point') {
      const s = (S2[i] + t * (0.3 + 0.5 * S1[i])) % 1;       // progress along the beam
      const along = s * 15, lat = 0.15 + 0.9 * (1 - s) * (1 - s);
      tx3 = c.x + pdx * along + ux * lat;
      ty3 = c.y + pdy * along + uy * lat;
      tz3 = uz * lat;
    } else {
      const R = (g === 'fist' ? 1.3 : g === 'idle' ? 5.5 : c.size) * (0.85 + 0.3 * S1[i]);
      const spin = (g === 'fist' ? 2.2 : g === 'idle' ? 0.25 : 0.9) * (0.6 + 0.8 * S2[i]);
      const a = t * spin, ca = Math.cos(a), sa = Math.sin(a);
      const rx = ux * ca + uz * sa, rz = -ux * sa + uz * ca;   // rotation around Y
      const ry = uy * cosT - rz * sinT, rz2 = uy * sinT + rz * cosT; // tilt
      tx3 = c.x + rx * R; ty3 = c.y + ry * R; tz3 = rz2 * R * 0.4;
    }

    let vx = vel[i3], vy = vel[i3+1], vz = vel[i3+2];
    vx += (tx3 - pos[i3])   * stiff * dt;
    vy += (ty3 - pos[i3+1]) * stiff * dt;
    vz += (tz3 - pos[i3+2]) * stiff * dt;
    vx *= damp; vy *= damp; vz *= damp;
    pos[i3] += vx * dt; pos[i3+1] += vy * dt; pos[i3+2] += vz * dt;
    vel[i3] = vx; vel[i3+1] = vy; vel[i3+2] = vz;

    const sp = Math.sqrt(vx*vx + vy*vy + vz*vz);
    if (sp > 0.05) { tmp.set(vx / sp, vy / sp, vz / sp); quats[i].setFromUnitVectors(UP, tmp); }

    dummy.position.set(pos[i3], pos[i3+1], pos[i3+2]);
    dummy.quaternion.copy(quats[i]);
    dummy.scale.set(1, 0.9 + Math.min(sp * 0.03, 0.5), 1);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
  renderer.render(scene, camera);
}
frame();
</script>
</body>
</html>
